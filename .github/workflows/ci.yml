name: Tests

# Pull requests and the merge queue, and ubuntu-latest only. The self-hosted
# runner is a machine in a house and every repository in this organisation is
# public; a fork's pull request running on it is the standard catastrophe. No
# pull_request-triggered job may ever name it.
#
# How much runs depends on the trigger (docs/testing.md, "What CI runs"): a
# pull request into dev runs the fast checks, plus the migration tests when it
# touches the schema; the merge queue into dev and a release into main run the
# full suite. It stays one job, `test`, whatever the trigger, because `test` is
# the check the rulesets require.
on:
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Every database-backed test creates and drops its own database
      # (tests/databases.py) through an administrative connection.
      # ubuntu-latest ships PostgreSQL but does not run it, so without this
      # service those tests error rather than skip. It starts on every run,
      # fast or full: a service cannot depend on a step's output.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: art
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The runner has no .env, so app/config.py would fall back to its own
      # defaults - user `art` with an empty password - and authentication
      # would fail even with the service healthy. Throwaway values for a
      # throwaway database.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: art
      APP_ENV: development
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the base of the pull request is present for
          # the diff below, and `origin/main` for the release round trip
          # (tests/test_migration_round_trip.py). A shallow clone holds only
          # the merge commit.
          fetch-depth: 0

      # A pull request that changes only documentation skips everything below
      # and still reports `test` as passed. Not a workflow-level paths-ignore:
      # that leaves the required check unreported, and an unreported required
      # check blocks the merge for ever. Documentation is `docs/**` and any
      # `*.md`; one other file anywhere runs the whole job. An empty diff runs
      # it too, so the fast path is only taken on positive evidence.
      - name: Decide whether anything but documentation changed
        id: changes
        env:
          # A merge-queue run has no pull_request payload; its base and head
          # are the merge group's. Without the fallback the diff would be
          # empty, which runs the whole job - safe, but never the fast path.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$changed"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$'; then
            echo "Documentation only: every other step is skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      # How much of the backend suite this run owes.
      #   full=true    the merge queue, a release into main, a pull request
      #                into any other base, or one that changes the test
      #                harness, the dependencies or this workflow - what the
      #                split cannot reason about runs everything.
      #   full=false   a pull request into dev: tests/unit, which needs no
      #                PostgreSQL. The merge queue runs the rest before it
      #                lands.
      #   schema=true  on that fast path, the pull request touches alembic/
      #                or app/models/, so the migration tests run as well.
      - name: Decide how much of the backend suite to run
        id: suite
        if: steps.changes.outputs.code == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" != "dev" ]; then
            echo "$EVENT into ${BASE_REF:-dev}: the full suite."
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          harness='^(tests/conftest\.py|tests/api/conftest\.py|tests/databases\.py|tests/revisions\.py|requirements(-dev)?\.txt|\.github/workflows/ci\.yml)$'
          if printf '%s\n' "$changed" | grep -qE "$harness"; then
            echo "The test harness, the dependencies or this workflow changed: the full suite."
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "full=false" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$changed" | grep -qE '^(alembic/|alembic\.ini$|app/models/)'; then
            echo "The schema changed: the fast checks and the migration tests."
            echo "schema=true" >> "$GITHUB_OUTPUT"
          else
            echo "The fast checks only."
            echo "schema=false" >> "$GITHUB_OUTPUT"
          fi

      # The bit has been lost six times across these repositories: both
      # development machines have core.fileMode=false, so git records 100644
      # for a file the filesystem calls executable and nothing in the working
      # tree disagrees. The box then cannot run the hook, and since the
      # registry declares migrations: true, that refuses EVERY deploy.
      #
      # ls-tree, not ls-files: the latter reads the index, which already
      # reflects a chmod that was never committed.
      - name: The migration hook must be executable in the commit
        if: steps.changes.outputs.code == 'true'
        run: |
          mode=$(git ls-tree HEAD -- deploy/migrations | awk '{print $1}')
          echo "deploy/migrations is $mode"
          test "$mode" = "100755"

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.code == 'true'
        with:
          # Same interpreter as the runtime image (dockerfile: python:3.13-slim).
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        if: steps.changes.outputs.code == 'true'
        run: pip install -r requirements-dev.txt

      # Two migrations parented on the same revision merge cleanly in git and
      # only collide in Alembic's revision graph. In a merge-queue run that is
      # exactly the combination being tested, and this says so in seconds.
      # Needs no database: `heads` reads the revision files.
      - name: One Alembic head
        if: steps.changes.outputs.code == 'true'
        run: |
          heads=$(alembic heads)
          echo "$heads"
          if [ "$(echo "$heads" | grep -c .)" -ne 1 ]; then
            echo "::error::More than one Alembic head. Reparent the newer revision's down_revision onto the other head."
            exit 1
          fi

      - name: Lint backend
        if: steps.changes.outputs.code == 'true'
        run: ruff check .

      - name: Lint shell scripts
        if: steps.changes.outputs.code == 'true'
        run: shellcheck deploy/migrations entrypoint.sh

      # -p no:cacheprovider: nothing in CI reads the cache back, and it is the
      # one thing a run writes outside tmp_path.
      - name: Unit tests
        if: steps.changes.outputs.code == 'true' && steps.suite.outputs.full == 'false'
        run: python -m pytest tests/unit -q -p no:cacheprovider

      # The from-zero build, the release round trip, and every revision's own
      # tests, which sit beside the generic guards.
      - name: Migration tests
        if: steps.changes.outputs.code == 'true' && steps.suite.outputs.schema == 'true'
        run: python -m pytest tests/test_migrations_build_the_schema.py tests/test_migration_round_trip.py -q -p no:cacheprovider

      - name: Full backend suite
        if: steps.changes.outputs.code == 'true' && steps.suite.outputs.full == 'true'
        run: python -m pytest tests/ -q -p no:cacheprovider

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        if: steps.changes.outputs.code == 'true'
        run: npm run lint
        working-directory: frontend

      - name: Test frontend
        if: steps.changes.outputs.code == 'true'
        run: npm test
        working-directory: frontend

      # dockerfile builds the frontend, so without this a bundle that does not
      # compile is found by the deploy rather than by the pull request.
      - name: Build the frontend
        if: steps.changes.outputs.code == 'true'
        run: npm run build
        working-directory: frontend
